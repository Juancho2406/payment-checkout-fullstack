# Local Postgres for the checkout API.
# No app containers here — Nest (apps/api) and Vite (apps/web) start later.
# Defaults are for a laptop only; override with infra/.env (gitignored).

services:
  postgres:
    image: postgres:16-alpine
    container_name: checkout-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-checkout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkout}
      POSTGRES_DB: ${POSTGRES_DB:-checkout}
    volumes:
      - checkout_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checkout} -d ${POSTGRES_DB:-checkout}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  checkout_pg_data:
