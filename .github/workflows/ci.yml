name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install and test
        run: pnpm run ci

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: aws-deploy-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Upsert PSP secret in Secrets Manager
        env:
          PSP_BASE_URL: ${{ secrets.PSP_BASE_URL }}
          PSP_PRIVATE_KEY: ${{ secrets.PSP_PRIVATE_KEY }}
          PSP_INTEGRITY_SECRET: ${{ secrets.PSP_INTEGRITY_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          for key in ("PSP_BASE_URL", "PSP_PRIVATE_KEY", "PSP_INTEGRITY_SECRET"):
              if not os.environ.get(key):
                  sys.exit(f"missing GitHub secret {key}")

          payload = json.dumps({
              "PSP_BASE_URL": os.environ["PSP_BASE_URL"],
              "PSP_PRIVATE_KEY": os.environ["PSP_PRIVATE_KEY"],
              "PSP_INTEGRITY_SECRET": os.environ["PSP_INTEGRITY_SECRET"],
          })
          name = "checkout/psp"
          exists = subprocess.run(
              ["aws", "secretsmanager", "describe-secret", "--secret-id", name],
              capture_output=True,
          )
          if exists.returncode == 0:
              cmd = [
                  "aws", "secretsmanager", "put-secret-value",
                  "--secret-id", name, "--secret-string", payload,
              ]
          else:
              cmd = [
                  "aws", "secretsmanager", "create-secret",
                  "--name", name, "--secret-string", payload,
              ]
          result = subprocess.run(cmd, capture_output=True, text=True)
          if result.returncode != 0:
              sys.stderr.write(result.stderr)
              sys.exit(result.returncode)
          print("PSP secret upserted (value not printed)")
          PY

      - name: Build SPA (same-origin /api/v1 via CloudFront)
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_PSP_BASE_URL: ${{ secrets.VITE_PSP_BASE_URL }}
          VITE_PSP_PUBLIC_KEY: ${{ secrets.VITE_PSP_PUBLIC_KEY }}
        run: pnpm --filter @checkout/web build

      - name: CDK bootstrap
        working-directory: infra/cdk
        run: pnpm exec cdk bootstrap

      - name: Pause after bootstrap
        run: sleep 20

      - name: Deploy network (VPC)
        working-directory: infra/cdk
        run: pnpm exec cdk deploy CheckoutNetwork --exclusively --require-approval never

      - name: Pause after network
        run: sleep 20

      - name: Deploy database (RDS)
        working-directory: infra/cdk
        run: pnpm exec cdk deploy CheckoutDb --exclusively --require-approval never

      - name: Pause after RDS
        run: sleep 30

      - name: Deploy API (Fargate + ALB)
        working-directory: infra/cdk
        run: pnpm exec cdk deploy CheckoutApi --exclusively --require-approval never

      - name: Wait for API targets to become healthy
        run: |
          set -euo pipefail
          TG="$(aws cloudformation describe-stacks --stack-name CheckoutApi \
            --query "Stacks[0].Outputs[?OutputKey=='ApiTargetGroupArn'].OutputValue" --output text)"
          echo "Waiting for target group ${TG}"
          for i in $(seq 1 40); do
            HEALTHY="$(aws elbv2 describe-target-health --target-group-arn "$TG" \
              --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" --output text)"
            TOTAL="$(aws elbv2 describe-target-health --target-group-arn "$TG" \
              --query "length(TargetHealthDescriptions)" --output text)"
            echo "attempt ${i}/40 — healthy ${HEALTHY}/${TOTAL}"
            if [ "$TOTAL" != "0" ] && [ "$HEALTHY" = "$TOTAL" ]; then
              echo "API targets healthy"
              exit 0
            fi
            sleep 15
          done
          echo "API targets did not become healthy"
          exit 1

      - name: Pause before SPA
        run: sleep 20

      - name: Deploy web (S3 + CloudFront)
        working-directory: infra/cdk
        run: pnpm exec cdk deploy CheckoutWeb --exclusively --require-approval never

      - name: Wait for HTTPS health on CloudFront
        run: |
          set -euo pipefail
          SPA="$(aws cloudformation describe-stacks --stack-name CheckoutWeb \
            --query "Stacks[0].Outputs[?OutputKey=='SpaUrl'].OutputValue" --output text)"
          echo "Waiting for ${SPA}/api/v1/health"
          for i in $(seq 1 40); do
            if curl -fsS "${SPA}/api/v1/health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "CloudFront healthy"
              {
                echo "## Live URLs"
                echo "- SPA: ${SPA}"
                echo "- API: ${SPA}/api/v1"
                echo "- Swagger: ${SPA}/docs"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "SPA_URL=${SPA}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "attempt ${i}/40 — sleeping 20s"
            sleep 20
          done
          echo "API did not become healthy on CloudFront"
          exit 1
